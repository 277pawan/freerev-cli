version: 2

project_name: freerev-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: revenant-free
    main: .
    binary: revenant
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "revenant_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - revenant.example.yaml

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^chore:'

release:
  github:
    owner: 277pawan
    name: freerev-cli
  draft: false
  prerelease: auto